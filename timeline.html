<!doctype html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Homeserver Timeline — Homeserver Spec Versions</title>
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/hammer.min.js"></script>
  <script src="lib/chartjs-plugin-zoom.min.js"></script>
  <script src="lib/chartjs-plugin-datalabels.min.js"></script>
  <script src="lib/chartjs-plugin-annotation.min.js"></script>
  <script src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="common.js" defer="defer"></script>
  <script src="timeline.js" defer="defer"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<nav>
    <a href="index.html" class="brand">Homeserver Spec Versions</a>
    <div class="links">
      <a href="index.html">Supported Versions</a>
      <a href="latency.html">Spec Latency</a>
      <a href="timeline.html" class="active">Homeserver Timeline</a>
    </div>
  </nav>

  <div class="controls">
    <h3>Maturity</h3>
    <p>Limit the displayed homeservers to their maturity.</p>
    <div class="control-group">
      <label><input type="checkbox" id="stable" onclick="render();" checked /> <span>Stable</span></label>
      <label><input type="checkbox" id="beta" onclick="render();" checked /> <span>Beta</span></label>
      <label><input type="checkbox" id="alpha" onclick="render();" checked /> <span>Alpha</span></label>
      <label><input type="checkbox" id="obsolete" onclick="render();" checked /> <span>Obsolete</span></label>
      <label><input type="checkbox" id="unstarted" onclick="render();" /> <span>Unstarted</span></label>
    </div>
  </div>

  <div class="chart-container">
    <button class="reset-zoom" onclick="resetZoom('homeserver-history');">reset zoom</button>
    <canvas id="homeserver-history"></canvas>
  </div>

  <div class="chart-container">
    <button class="reset-zoom" onclick="resetZoom('homeserver-activity');">reset zoom</button>
    <canvas id="homeserver-activity"></canvas>
  </div>

  <hr>

  <div class="footer">
    See the <a href="https://github.com/clokep/homeserver-spec-versions/">source on GitHub</a>.
  </div>
</body>

</html>
